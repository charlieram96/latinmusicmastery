name: LatinMusicMastery

options:
  bundleIdPrefix: com.latinmusicmastery
  deploymentTarget:
    iOS: "17.0"

packages:
  LMMKit:
    path: Packages/LMMKit

targets:
  LatinMusicMastery:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    configFiles:
      Debug: App/Config/Debug.xcconfig
      Release: App/Config/Release.xcconfig
    entitlements:
      path: App/LatinMusicMastery.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.latinmusicmastery.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.latinmusicmastery.app
            CFBundleURLSchemes:
              - lmm
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        NSMicrophoneUsageDescription: "PlaySense listens to your instrument to score your practice."
        NSBluetoothAlwaysUsageDescription: "Connect your PlaySense device to play."
    dependencies:
      - package: LMMKit
        product: LMMFeatures
      - package: LMMKit
        product: LMMDesignSystem
      - package: LMMKit
        product: LMMData

schemes:
  LatinMusicMastery:
    build:
      targets:
        LatinMusicMastery: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
