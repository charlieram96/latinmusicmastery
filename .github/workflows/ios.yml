name: iOS

on:
  push:
    paths:
      - "ios/**"
  pull_request:
    paths:
      - "ios/**"

jobs:
  package-tests:
    name: Swift Package Tests
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/Packages/LMMKit
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test

  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        working-directory: ios
        run: swiftlint lint --strict

