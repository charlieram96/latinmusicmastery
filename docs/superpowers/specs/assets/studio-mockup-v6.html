<title>PlaySense Studio Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --background:20 10% 5%; --foreground:30 10% 93%; --card:20 8% 8.5%; --muted:20 7% 12%; --muted-foreground:25 6% 63%;
  --border:0 0% 100% / .1; --primary:30 85% 55%; --primary-foreground:26 45% 8%; --gold-highlight:38 60% 58%;
  --terracotta:14 55% 46%; --destructive:0 72% 60%; --sidebar:20 10% 4%; --teal:180 55% 45%; --ok:142 45% 52%;
  --mono:ui-monospace, "SF Mono", Menlo, monospace;
  --sans:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
html,body{height:100%}
body{margin:0;background:hsl(var(--background));color:hsl(var(--foreground));font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid hsl(var(--primary));outline-offset:2px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.smufl{font-family:Bravura, serif;line-height:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* mockup banner */
.mock{display:flex;align-items:center;gap:10px;height:26px;padding:0 12px;background:repeating-linear-gradient(135deg,hsl(38 60% 58% / .07) 0 10px,transparent 10px 20px),#0a0807;border-bottom:1px dashed hsl(38 60% 58% / .3);font-size:11px;color:hsl(var(--gold-highlight));white-space:nowrap;overflow-x:auto}
.mock b{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:9.5px}
.mock .st-seg{padding:2px}.mock .st-seg button{height:19px;font-size:10.5px;padding:0 8px}
.mock .link{border:0;background:none;color:hsl(var(--gold-highlight));text-decoration:underline;text-underline-offset:3px;padding:0;font-size:11px}

.frame{height:calc(100% - 26px);display:flex}
.admin-rail{width:64px;flex:none;background:hsl(var(--sidebar));border-right:1px solid hsl(var(--border));display:flex;flex-direction:column;align-items:center}
.admin-rail .hd{height:52px;display:grid;place-items:center}
.admin-rail .hd span{width:28px;height:28px;border-radius:10px;background:hsl(var(--primary)/.1);color:hsl(var(--primary));display:grid;place-items:center}
.admin-rail nav{display:flex;flex-direction:column;gap:2px;align-items:center;flex:1}
.admin-rail nav a{width:40px;display:flex;justify-content:center;padding:8px 0;border-radius:10px;color:hsl(var(--foreground)/.55)}
.admin-rail nav a.on{background:hsl(var(--primary)/.1);color:hsl(var(--primary))}
.admin-rail nav hr{width:24px;border:0;height:1px;background:hsl(var(--border));margin:6px 0}
.studio{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}

/* app bar */
.st-appbar{flex-shrink:0;display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;border-bottom:1px solid hsl(var(--border));background:hsl(var(--card))}
.back{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:6px 8px;font-size:13.5px;color:hsl(var(--muted-foreground));text-decoration:none}
.back:hover{background:hsl(var(--muted));color:hsl(var(--foreground))}
.badge{border-radius:8px;border:1px solid hsl(var(--border));background:hsl(var(--muted));padding:2px 8px;font:10.5px var(--mono);color:hsl(var(--muted-foreground));white-space:nowrap}
.status-txt{font-size:12px;color:hsl(var(--muted-foreground));white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn-save{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;background:hsl(var(--primary));color:hsl(var(--primary-foreground));padding:7px 14px;font-size:13px;font-weight:500;opacity:.5;cursor:default;white-space:nowrap}
.ghost-ic{border:1px solid transparent;background:none;border-radius:8px;padding:7px;color:hsl(var(--muted-foreground));display:inline-flex}
.ghost-ic:hover{background:hsl(var(--muted));color:hsl(var(--foreground))}
.ghost-ic:disabled{opacity:.35;cursor:default}

/* shared primitives (from app/globals.css) */
.st-seg{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:10px;background:hsl(var(--muted));border:1px solid hsl(var(--border))}
.st-seg button{height:24px;padding:0 9px;border:none;background:none;border-radius:7px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1;color:hsl(var(--muted-foreground));white-space:nowrap}
.st-seg button.is-on{background:hsl(var(--primary));color:hsl(var(--primary-foreground));box-shadow:0 1px 3px rgba(0,0,0,.25)}
.st-seg button svg.i{width:14px;height:14px}
.st-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:9px;font-size:12px;font-weight:600;background:hsl(var(--card));border:1px solid hsl(var(--border));color:hsl(var(--foreground));white-space:nowrap;transition:background .12s}
.st-chip:hover{background:hsl(var(--muted))}
.st-chip.is-on{background:color-mix(in srgb,hsl(var(--primary)) 16%,transparent);border-color:color-mix(in srgb,hsl(var(--primary)) 36%,transparent);color:hsl(var(--primary))}
.st-chip svg.i{width:14px;height:14px}
.st-chip.block{width:100%;justify-content:flex-start;height:34px}
.st-iconbtn{width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:none;color:hsl(var(--muted-foreground));display:inline-flex;align-items:center;justify-content:center;flex:none;transition:background .12s,color .12s}
.st-iconbtn:hover,.st-iconbtn.is-on{background:hsl(var(--muted));color:hsl(var(--foreground))}
.st-iconbtn.amber{color:hsl(var(--primary))}
.st-iconbtn:disabled{opacity:.35;cursor:default}
.st-iconbtn svg.i{width:15px;height:15px}
.st-divline{width:1px;height:20px;background:hsl(var(--border));flex:none}
.st-sec-label{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:hsl(var(--muted-foreground))}
.st-prop{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}
.st-prop .k{color:hsl(var(--muted-foreground))}
.st-prop .v{font:600 12px var(--mono);font-variant-numeric:tabular-nums}
.st-pip{width:8px;height:8px;border-radius:50%;background:hsl(var(--ok));box-shadow:0 0 7px hsl(var(--ok)/.8);flex:none;display:inline-block}
.st-pip.warn{background:hsl(var(--gold-highlight));box-shadow:0 0 7px hsl(var(--gold-highlight)/.8)}
.st-pip.bad{background:hsl(var(--destructive));box-shadow:0 0 7px hsl(var(--destructive)/.8)}
.st-btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border:none;border-radius:9px;font-size:12.5px;font-weight:600;color:hsl(var(--primary-foreground));background:linear-gradient(180deg,color-mix(in srgb,hsl(var(--primary)) 82%,white),hsl(var(--primary)));box-shadow:0 4px 14px -2px hsl(var(--primary)/.55);white-space:nowrap}
.st-input{height:34px;width:100%;padding:0 11px;border-radius:9px;font-size:13px;background:hsl(var(--muted));border:1px solid hsl(var(--border))}
.st-select{position:relative}
.st-select select{height:34px;width:100%;padding:0 30px 0 11px;border-radius:9px;font-size:13px;font-weight:600;background:hsl(var(--muted));border:1px solid hsl(var(--border));appearance:none}
.st-select .caret{position:absolute;right:9px;top:10px;color:hsl(var(--muted-foreground));pointer-events:none}
.st-stepper{display:flex;align-items:center;height:40px;border-radius:10px;background:hsl(var(--muted));border:1px solid hsl(var(--border));overflow:hidden}
.st-stepper button{width:36px;height:100%;border:0;background:none;color:hsl(var(--muted-foreground));display:grid;place-items:center}
.st-stepper .val{flex:1;text-align:center;font:600 17px var(--mono)}
.st-stepper .unit{font-size:10.5px;color:hsl(var(--muted-foreground));margin-left:4px;font-family:var(--sans);font-weight:600}
.flabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:hsl(var(--muted-foreground));margin-bottom:6px;display:block}

/* ---------- work area + hover rail ---------- */
.work{flex:1;min-height:0;position:relative;display:flex;padding-left:52px}
.rail{position:absolute;left:0;top:0;bottom:0;width:52px;z-index:40;display:flex;background:color-mix(in srgb,hsl(var(--card)) 70%,hsl(var(--background)));border-right:1px solid hsl(var(--border));transition:width .12s var(--ease),box-shadow .12s;overflow:hidden}
.rail.open{width:340px;box-shadow:24px 0 60px rgba(0,0,0,.55)}
.rail-icons{width:52px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
.rail-icons button{position:relative;width:36px;height:36px;border-radius:10px;border:0;background:none;color:hsl(var(--muted-foreground));display:grid;place-items:center}
.rail-icons button:hover,.rail-icons button.on{background:hsl(var(--muted));color:hsl(var(--foreground))}
.rail-icons .badge-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 2px color-mix(in srgb,hsl(var(--card)) 70%,hsl(var(--background)))}
.rail-icons .sp{flex:1}
.rail-body{width:288px;flex:none;overflow-y:auto;padding:14px 16px 20px 4px;display:flex;flex-direction:column;gap:18px;opacity:0;transform:translateX(-8px);transition:opacity .1s,transform .12s var(--ease)}
.rail.open .rail-body{opacity:1;transform:none;transition-delay:0s}
.rsec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:10px}
.rsec + .rsec{border-top:1px solid hsl(var(--border));padding-top:16px}
.sec-row{display:flex;align-items:center;gap:10px;border-radius:10px;border:1px solid transparent;padding:7px 10px}
.sec-row.on{border-color:hsl(var(--primary)/.4);background:hsl(var(--primary)/.1)}
.sec-row .dot{width:10px;height:10px;border-radius:50%;flex:none}
.sec-row .nm{font-size:13px;font-weight:500}
.sec-row.on .nm{color:hsl(var(--primary))}
.sec-row .sub{font:10px var(--mono);color:hsl(var(--muted-foreground))}
.ts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ts-grid .st-chip{justify-content:center;font-family:var(--mono)}
.flag-row{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:12px;padding:4px 6px;border-radius:7px}
.flag-row:hover{background:hsl(var(--muted))}
.note-txt{font-size:11.5px;color:hsl(var(--muted-foreground));margin:0;line-height:1.5}

main.stage-col{flex:1;min-width:0;min-height:0;display:flex;padding:10px}
.st-stage{
  --background:20 14% 5%; --foreground:40 30% 92%; --card:22 14% 8%; --muted:24 12% 13%; --muted-foreground:30 10% 56%;
  --border:0 0% 100% / 0.09; --primary-foreground:26 45% 8%;
  position:relative;display:flex;flex-direction:column;flex:1;min-height:0;min-width:0;border-radius:14px;overflow:hidden;
  background:radial-gradient(130% 80% at 50% -10%,hsl(var(--primary)/.09),transparent 60%),hsl(20 14% 5%);
  box-shadow:inset 0 0 90px rgba(0,0,0,.5);color:hsl(var(--foreground));
}
.wave-wrap{position:relative;flex:none}
#wave{display:block;width:100%;touch-action:none}
.wtools{position:absolute;top:28px;right:10px;z-index:6;display:flex;align-items:center;gap:2px;height:32px;padding:0 4px;border-radius:10px;border:1px solid hsl(var(--border));background:color-mix(in srgb,hsl(var(--card)) 84%,transparent);backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(0,0,0,.35);opacity:.72;transition:opacity .15s}
.wtools:hover,.wtools:focus-within{opacity:1}
.wtools .st-seg{padding:2px}.wtools .st-seg button{height:22px;font-size:11px;padding:0 7px}
.wtools input[type=range]{width:86px;accent-color:hsl(var(--primary))}
.wtools .auto{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;border:0;font-size:11.5px;font-weight:600;background:hsl(var(--primary)/.14);color:hsl(var(--primary))}
.wtools .auto:hover{background:hsl(var(--primary)/.24)}
.sec-lane{position:relative;height:26px;flex:none;border-top:1px solid hsl(var(--border));background:rgba(255,255,255,.015);overflow:hidden}
.sblock{position:absolute;top:3px;bottom:3px;display:flex;align-items:center;gap:6px;padding:0 8px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:6px;background:color-mix(in srgb,var(--c) 20%,transparent);font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;cursor:grab;transition:background .12s}
.sblock:hover{background:color-mix(in srgb,var(--c) 30%,transparent)}
.sblock.is-active{border-width:1.5px;border-color:var(--c)}
.sblock.dragging{cursor:grabbing;background:color-mix(in srgb,var(--c) 38%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.sblock svg.i{width:12px;height:12px;opacity:.6}
#lanes{display:block;width:100%;border-top:1px solid hsl(var(--border));touch-action:none}
.splitter{height:9px;flex:none;cursor:row-resize;position:relative;border-top:1px solid hsl(var(--border))}
.splitter::after{content:'';position:absolute;left:50%;top:3px;width:36px;height:3px;border-radius:3px;background:hsl(var(--foreground)/.14);transform:translateX(-50%);transition:background .12s,width .12s}
.splitter:hover::after{background:hsl(var(--primary)/.7);width:56px}

/* ---------- strip ---------- */
.strip{position:relative;flex:1;min-height:170px;background:hsl(var(--card));overflow:hidden;color:hsl(40 30% 92%);user-select:none;touch-action:none}
#stripSvg{position:absolute;inset:0;pointer-events:none}
.replane{position:absolute;left:0;right:0;top:0;height:20px;z-index:3}
.rband{position:absolute;top:3px;height:15px;border-radius:5px;display:flex;align-items:center;gap:5px;padding:0 7px;font-size:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;cursor:pointer;color:hsl(var(--teal));background:hsl(var(--teal)/.18);border:1px solid hsl(var(--teal)/.55);transition:background .12s}
.rband:hover{background:hsl(var(--teal)/.28)}
.rband.copy{background:repeating-linear-gradient(135deg,hsl(var(--teal)/.2) 0 5px,hsl(var(--teal)/.06) 5px 10px);border-style:dashed;color:hsl(var(--teal)/.9);font-weight:600}
.rband svg.i{width:11px;height:11px;stroke-width:2.4}
.mbox{position:absolute;top:20px;bottom:0;border-left:1px solid transparent}
.mbox .hb{position:absolute;left:0;right:0;top:0;height:22px;display:flex;align-items:center;gap:6px;padding:0 7px;font-size:11px;color:hsl(var(--muted-foreground));border-bottom:1px solid hsl(var(--border));white-space:nowrap;overflow:hidden;transition:background .12s,color .12s}
.mbox:hover .hb{background:hsl(var(--primary)/.1);color:hsl(var(--foreground))}
.mbox.rep .hb{background:hsl(var(--teal)/.07)}
.mbox.copy::after{content:'';position:absolute;inset:22px 0 0;background:repeating-linear-gradient(135deg,hsl(var(--teal)/.05) 0 6px,transparent 6px 12px);pointer-events:none}
.cap{margin-left:auto;font:600 10.5px var(--mono);padding:1px 6px;border-radius:5px;color:hsl(var(--muted-foreground));background:hsl(0 0% 100%/.04)}
.cap.short{color:hsl(var(--gold-highlight));background:hsl(var(--gold-highlight)/.14)}
.cap.over{color:hsl(var(--destructive));background:hsl(var(--destructive)/.16)}
.cap.empty{color:hsl(var(--muted-foreground)/.8);background:none;border:1px dashed hsl(var(--border))}
.mbox.over{background:hsl(var(--destructive)/.06)}
.gapfill{position:absolute;border-radius:6px;background:repeating-linear-gradient(135deg,hsl(var(--gold-highlight)/.22) 0 4px,transparent 4px 9px);border:1px dashed hsl(var(--gold-highlight)/.5);pointer-events:none;display:grid;place-items:center;font:600 10px var(--mono);color:hsl(var(--gold-highlight))}
.mbox.sel{background:hsl(var(--primary)/.07);box-shadow:inset 0 0 0 1.5px hsl(var(--primary)/.8)}
.mbox.sel .hb{background:hsl(var(--primary)/.2);color:hsl(var(--foreground))}
.mbox.narrow .hb{justify-content:center;padding:0}
.mbox.narrow .cap{display:none}
.mbox .flagdot{width:6px;height:6px;border-radius:50%;flex:none}
.mbox.new{animation:grow .35s var(--ease)}
@keyframes grow{from{opacity:0;transform:scaleX(.4);transform-origin:left}}
.gap-add{padding:0;line-height:0;position:absolute;top:43px;z-index:4;width:20px;height:20px;border-radius:999px;display:grid;place-items:center;transform:translateX(-50%) scale(.8);background:hsl(var(--card));border:1px solid hsl(var(--border));color:hsl(var(--muted-foreground));opacity:0;transition:opacity .12s,transform .12s}
.strip:hover .gap-add{opacity:.7;transform:translateX(-50%) scale(1)}
.gap-add:hover{opacity:1!important;color:hsl(var(--primary));border-color:hsl(var(--primary)/.5)}
.gap-add svg.i{width:12px;height:12px;display:block}
.st-iconbtn,.help-btn,.st-play-btn{padding:0}
.st-iconbtn svg.i,.st-play-btn svg.i{display:block}
.mbox.out{opacity:.34}
.gband{position:absolute;top:3px;height:15px;border-radius:5px;display:flex;align-items:center;gap:5px;padding:0 7px;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;color:hsl(150 58% 58%);background:hsl(150 58% 42% / .16);border:1px solid hsl(150 58% 42% / .6)}
.gband.ci{color:hsl(var(--gold-highlight));background:repeating-linear-gradient(135deg,hsl(38 60% 58% / .2) 0 5px,transparent 5px 10px);border:1px dashed hsl(38 60% 58% / .6);font-weight:600}
.countdown{position:absolute;inset:0;z-index:9;display:grid;place-items:center;pointer-events:none;font:800 96px/1 Montserrat, var(--sans);color:hsl(var(--gold-highlight));text-shadow:0 8px 40px rgba(0,0,0,.7);animation:pop .25s var(--ease)}
.countdown small{display:block;font:600 13px var(--sans);color:hsl(var(--muted-foreground));text-align:center;margin-top:6px;letter-spacing:.08em;text-transform:uppercase}
.sblock.edge-l{cursor:w-resize}.sblock .grip{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}.sblock .grip.l{left:0}.sblock .grip.r{right:0}
.toggle{display:flex;align-items:center;gap:10px;font-size:12.5px;cursor:pointer}.toggle input{accent-color:hsl(var(--primary));width:16px;height:16px}
.btn-publish{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:10px;border:1px solid hsl(var(--border));background:hsl(var(--muted));color:hsl(var(--muted-foreground));font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s,color .15s}
.btn-publish.dirty{border-color:transparent;color:hsl(var(--primary-foreground));background:linear-gradient(180deg,color-mix(in srgb,hsl(var(--primary)) 82%,white),hsl(var(--primary)));animation:pubpulse 2.2s infinite}
@keyframes pubpulse{0%{box-shadow:0 0 0 0 hsl(var(--primary)/.55)}70%{box-shadow:0 0 0 9px hsl(var(--primary)/0)}100%{box-shadow:0 0 0 0 hsl(var(--primary)/0)}}
.btn-publish .count{min-width:20px;height:20px;border-radius:999px;background:hsl(var(--primary-foreground));color:hsl(var(--primary));font:700 11px var(--mono);display:grid;place-items:center;padding:0 5px}
#partSeg button[data-dirty="1"]::after{content:'';width:6px;height:6px;border-radius:50%;background:hsl(var(--gold-highlight));box-shadow:0 0 6px hsl(var(--gold-highlight))}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:12.5px;padding:4px 0}
.hrow .sub{font:10.5px var(--mono);color:hsl(var(--muted-foreground))}
.hrow .live{font:700 9px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--ok));margin-left:6px}
.hrow .st-chip{height:26px;padding:0 9px;font-size:11.5px}
.piano{height:56px;flex:none;position:relative;border-top:1px solid hsl(var(--border));background:hsl(22 14% 6%);display:flex;padding:4px 6px 6px}
.piano .wk{flex:1;margin:0 1px;border-radius:0 0 5px 5px;background:hsl(40 30% 88%);border:0;padding:0 0 3px;font:600 9px var(--mono);color:hsl(20 14% 35%);display:flex;align-items:flex-end;justify-content:center}
.piano .bk{position:absolute;top:4px;height:30px;border-radius:0 0 4px 4px;background:hsl(20 14% 12%);border:1px solid hsl(0 0% 100%/.14);padding:0;z-index:1}
.piano .wk:active,.piano .bk:active,.piano .on{background:hsl(var(--primary))}
.piano .midi-st{position:absolute;right:10px;top:-18px;font:10px var(--mono);color:hsl(var(--muted-foreground))}
.fx-note{font-size:11px;color:hsl(210 70% 72%)}
.s-playhead{position:absolute;top:20px;bottom:0;width:2px;background:hsl(var(--primary));z-index:5;pointer-events:none}
.corner{position:absolute;right:8px;top:24px;z-index:6;display:flex;gap:2px;align-items:center;padding:2px;border-radius:9px;background:hsl(var(--card)/.85);backdrop-filter:blur(4px)}
.strip-foot{position:absolute;left:8px;right:8px;bottom:8px;z-index:6;display:flex;align-items:center;gap:8px;pointer-events:none}
.strip-foot > *{pointer-events:auto}
.hint{font-size:11px;color:hsl(var(--muted-foreground)/.85);transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint .k{font:10px var(--mono);background:hsl(var(--muted));border:1px solid hsl(var(--border));border-radius:4px;padding:0 5px;color:hsl(var(--foreground)/.85)}
.issue-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;border:1px solid hsl(var(--gold-highlight)/.4);background:hsl(var(--gold-highlight)/.12);color:hsl(var(--gold-highlight));font-size:11.5px;font-weight:600;white-space:nowrap}
.issue-chip.bad{border-color:hsl(var(--destructive)/.45);background:hsl(var(--destructive)/.12);color:hsl(var(--destructive))}
.help-btn{margin-left:auto;width:24px;height:24px;border-radius:999px;border:1px solid hsl(var(--border));background:hsl(var(--card));color:hsl(var(--muted-foreground));font-size:12px;font-weight:700}
.help-btn:hover{color:hsl(var(--foreground))}
.scrollind{position:absolute;left:0;right:0;bottom:0;height:4px;z-index:5;opacity:0;transition:opacity .2s}
.strip:hover .scrollind,.scrollind.show{opacity:1}
.scrollind i{position:absolute;top:0;height:4px;border-radius:4px;background:hsl(var(--foreground)/.35)}

/* floating bars + popovers */
.fbar{position:absolute;z-index:8;display:flex;align-items:center;gap:2px;padding:4px;border-radius:12px;background:hsl(22 14% 11% / .97);border:1px solid hsl(0 0% 100% / .14);box-shadow:0 12px 32px rgba(0,0,0,.55);backdrop-filter:blur(8px);white-space:nowrap;animation:pop .16s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(5px) scale(.97)}}
.fbar .fb{height:30px;min-width:30px;padding:0 8px;border:0;border-radius:8px;background:none;color:hsl(var(--foreground));display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;transition:background .1s}
.fbar .fb:hover{background:hsl(var(--muted))}
.fbar .fb.on{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.fbar .fb.dim{color:hsl(var(--muted-foreground))}
.fbar .fb.danger:hover{background:hsl(var(--destructive)/.15);color:hsl(var(--destructive))}
.fbar .fb svg.i{width:15px;height:15px}
.fbar .fb .smufl{font-size:22px;transform:translateY(-2px)}
.fbar .sep{width:1px;height:20px;background:hsl(0 0% 100% / .1);margin:0 3px}
.fbar .info{font:11px var(--mono);color:hsl(var(--muted-foreground));padding:0 8px;display:inline-flex;gap:8px;align-items:center}
.fbar .kb{font:10px var(--mono);opacity:.55}
.pop{position:fixed;z-index:80;width:320px;max-width:calc(100vw - 16px);background:hsl(22 14% 10% / .98);border:1px solid hsl(0 0% 100% / .14);border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.6);padding:10px;animation:pop .16s var(--ease);color:hsl(40 30% 92%)}
.pop .tabs{display:flex;gap:2px;margin-bottom:10px;flex-wrap:wrap}
.pop .tabs button{border:0;background:none;padding:5px 9px;border-radius:7px;font-size:12px;font-weight:600;color:hsl(30 10% 56%)}
.pop .tabs button.on{background:hsl(24 12% 16%);color:hsl(40 30% 92%)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px}
.pal.wide{grid-template-columns:repeat(auto-fill,minmax(62px,1fr))}
.pal.list{grid-template-columns:1fr}
.pal button{height:38px;border:1px solid hsl(0 0% 100% / .08);background:hsl(24 12% 13%);border-radius:8px;display:grid;place-items:center;padding:0;font-size:11.5px;font-weight:600;transition:border-color .1s}
.pal.list button{display:flex;justify-content:flex-start;gap:9px;padding:0 10px;font-weight:500;font-size:12.5px}
.pal button:hover{border-color:hsl(0 0% 100% / .22)}
.pal button.on{border-color:hsl(var(--primary));background:hsl(var(--primary)/.14);color:hsl(var(--primary))}
.pal .smufl{font-size:24px;transform:translateY(-3px)}
.pal .dyn{font-size:28px;transform:translateY(-6px)}
.pop .hint2{font-size:11.5px;color:hsl(30 10% 56%);margin:8px 2px 0;line-height:1.45}
.pop .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pop h4{margin:0 0 8px;font-size:12.5px;font-weight:600}
.pop .grp+.grp{margin-top:12px}
.pop .glabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:hsl(30 10% 56%);margin-bottom:6px}
.pop .shortcuts{display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:12px}
.pop .shortcuts span:nth-child(even){font:10.5px var(--mono);color:hsl(40 30% 92%);background:hsl(24 12% 16%);border-radius:4px;padding:1px 6px;justify-self:end}
.tip{position:fixed;z-index:90;pointer-events:none;background:hsl(40 30% 92%);color:hsl(20 14% 6%);font:600 11px var(--mono);padding:3px 7px;border-radius:6px;transform:translate(-50%,-130%);white-space:nowrap}

/* focus */
.focus{position:absolute;inset:0;z-index:7;background:hsl(22 14% 8%);display:flex;flex-direction:column}
.focus .fhead{height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid hsl(var(--border));position:relative}
.focus .ftitle{display:flex;flex-direction:column;line-height:1.2;white-space:nowrap}
.focus .ftitle b{font-size:13px}
.focus .ftitle span{font:10.5px var(--mono);color:hsl(var(--muted-foreground))}
.focus .fbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(56px,13%) 1fr minmax(56px,13%)}
.sliver{position:relative;opacity:.35;cursor:pointer;overflow:hidden;border-right:1px solid hsl(var(--border));transition:opacity .15s}
.sliver.r{border-right:0;border-left:1px solid hsl(var(--border))}
.sliver:hover{opacity:.7}
.sliver .lab{position:absolute;top:8px;left:10px;font:10px var(--mono);color:hsl(var(--muted-foreground));z-index:1}
.sliver.r .lab{left:auto;right:10px}
.fcenter{position:relative;overflow:hidden}
.beat-band{position:absolute;top:0;bottom:24px;pointer-events:none}
.beat-band:nth-child(odd){background:rgba(255,255,255,.022)}
.beat-band span{position:absolute;top:6px;left:6px;font:600 10px var(--mono);color:hsl(var(--muted-foreground)/.8)}
.fsvg{position:absolute;inset:0}
.meter{position:absolute;left:14px;right:14px;bottom:9px;height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,hsl(0 0% 100%/.08) 0 4px,transparent 4px 8px);display:flex;overflow:hidden}
.meter i{height:100%;background:hsl(var(--primary)/.7);border-right:1px solid hsl(22 14% 8%);transition:width .2s var(--ease)}
.meter i.rest{background:hsl(var(--muted-foreground)/.35)}
.meter.over i{background:hsl(var(--destructive)/.75)}
.note-ring{position:absolute;border-radius:6px;box-shadow:0 0 0 2px hsl(var(--gold-highlight));pointer-events:none;transition:all .12s var(--ease)}
.caret{position:absolute;width:2px;background:hsl(var(--primary));box-shadow:0 0 10px hsl(var(--primary)/.7);border-radius:2px;animation:blink 1.1s steps(2) infinite;pointer-events:none}
@keyframes blink{50%{opacity:.35}}
.ghost{position:absolute;width:15px;height:11px;border-radius:50%;background:hsl(var(--gold-highlight)/.6);transform:translate(-50%,-50%) rotate(-18deg);pointer-events:none}

/* PiP video */
.pip{position:absolute;z-index:30;width:236px;border-radius:12px;overflow:hidden;border:1px solid hsl(0 0% 100% / .14);background:#000;box-shadow:0 16px 40px rgba(0,0,0,.6);transition:width .2s var(--ease)}
.pip canvas{display:block;width:100%;aspect-ratio:16/9}
.pip .bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:5px 6px 5px 9px;background:linear-gradient(rgba(0,0,0,.65),transparent);opacity:0;transition:opacity .15s;cursor:grab;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#f1ece6}
.pip:hover .bar{opacity:1}
.pip .bar .pipdot{width:6px;height:6px;border-radius:50%;background:hsl(var(--destructive));box-shadow:0 0 6px hsl(var(--destructive))}
.pip .bar button{margin-left:auto;border:0;background:rgba(0,0,0,.4);color:#fff;border-radius:6px;width:22px;height:22px;display:grid;place-items:center}
.pip.min{width:auto}
.pip.min canvas{display:none}
.pip.min .bar{position:static;opacity:1;background:hsl(22 14% 11%);padding:6px 6px 6px 10px}

/* transport: one row */
.st-transport{flex-shrink:0;display:flex;align-items:center;gap:10px;height:54px;padding:0 14px;border-top:1px solid hsl(var(--border));background:hsl(var(--card))}
.st-play-btn{width:36px;height:36px;border:none;border-radius:50%;background:linear-gradient(135deg,hsl(var(--primary)),hsl(var(--terracotta)));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px -3px hsl(var(--primary)/.5);flex:none}
.st-play-btn svg.i{width:16px;height:16px}
.tp-time{font:12.5px var(--mono);white-space:nowrap}
.tp-time .sep{color:hsl(var(--muted-foreground));margin:0 2px}
.scrub{position:relative;flex:1;min-width:80px;height:28px;cursor:pointer}
.scrub .track{position:absolute;top:9px;left:0;right:0;height:9px;border-radius:999px;background:hsl(var(--foreground)/.22)}
.scrub .fill{position:absolute;top:9px;left:0;height:9px;border-radius:999px;background:hsl(var(--primary))}
.scrub .reg{position:absolute;top:9px;height:9px;border-radius:4px;background:hsl(150 58% 42% / .8);box-shadow:inset 0 0 0 1px hsl(150 58% 42%)}
.scrub .tag{position:absolute;top:20px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:3px;padding:1px 4px;font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:hsl(150 58% 42%);color:#fff;line-height:1}
.scrub .ph{position:absolute;top:5px;width:3px;height:17px;border-radius:999px;background:hsl(var(--primary));transform:translateX(-50%);box-shadow:0 1px 3px rgba(0,0,0,.5)}

.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:hsl(22 14% 12%);border:1px solid hsl(0 0% 100% / .14);padding:9px 14px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.55);z-index:95;max-width:calc(100% - 32px);font-size:12.5px;animation:pop .18s var(--ease)}
.toast button{margin-left:10px;border:0;background:none;color:hsl(var(--primary));font-weight:600;padding:0}
.whatsnew{position:fixed;top:32px;left:12px;z-index:96;width:min(470px,calc(100% - 24px));max-height:calc(100% - 50px);overflow:auto;background:hsl(22 14% 10%);border:1px solid hsl(38 60% 58% / .35);border-radius:14px;padding:16px 18px;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:pop .18s var(--ease)}
.whatsnew h3{margin:0 0 10px;font:700 14px Montserrat, var(--sans)}
.whatsnew ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:hsl(var(--foreground)/.9)}
.whatsnew b{color:hsl(var(--gold-highlight));font-weight:600}

/* ================= transport ================= */
let AC = null, SRC = null, P0 = null, RAF = 0, CLK = [];
function play(){
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); AC.resume();
  if (!S.audio.buffer){ const b = AC.createBuffer(1, S.audio.data.length, S.audio.sr); b.copyToChannel(S.audio.data, 0); S.audio.buffer = b; }
  const wb = warpedBuffer(); let buf = S.audio.buffer; if (wb){ if (!S.warpAB || S.warpAB._src !== wb){ S.warpAB = AC.createBuffer(1, wb.length, S.audio.sr); S.warpAB.copyToChannel(wb, 0); S.warpAB._src = wb; } buf = S.warpAB; }
  SRC = AC.createBufferSource(); SRC.buffer = buf; SRC.playbackRate.value = S.rate; const rg = AC.createGain(); rg.gain.value = S.hear === 'score' ? 0 : 1; SRC.connect(rg).connect(AC.destination); const t0 = AC.currentTime + .04; SRC.start(t0, Math.max(0, S.playT)); P0 = { c:t0, t:S.playT };
  if (S.hear !== 'rec') scheduleScore(t0);
  if (S.preview){ const beat = 4 / tsAt(S.ex.from)[1] * exSpq(); for (let t = countInStart(), k = 0; t < exStart() - 1e-6; t += beat, k++){ if (t < S.playT) continue; const w = t0 + (t - S.playT) / S.rate;
    const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = k % tsAt(S.ex.from)[0] === 0 ? 1560 : 1040; g.gain.setValueAtTime(0, w); g.gain.linearRampToValueAtTime(.3, w + .002); g.gain.exponentialRampToValueAtTime(.0001, w + .05); o.connect(g).connect(AC.destination); o.start(w); o.stop(w + .06); CLK.push(o); } }
  if (S.click) for (let m = 0; m < NM(); m++){ const beat = 4 / tsAt(m)[1]; for (let q = 0; q < barQn(m) - 1e-9; q += beat){ const at = tAtQ(m, q); if (at < S.playT) continue; const w = t0 + (at - S.playT) / S.rate;
    const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = q === 0 ? 1560 : 1040; g.gain.setValueAtTime(0, w); g.gain.linearRampToValueAtTime(.25, w + .002); g.gain.exponentialRampToValueAtTime(.0001, w + .05); o.connect(g).connect(AC.destination); o.start(w); o.stop(w + .06); CLK.push(o); } }
  S.playing = true; SRC.onended = () => { if (S.playing) stop(); }; setPlayIc(); loop();
}
function scheduleScore(t0){ // "listen to the score": the written notes, synthesised, voice 1
  const skip = new Set();
  MS().forEach((mm, m) => { let q = 0; mm.voices[0].forEach(e => { const len = evQn(e);
    if (!e.rest && !skip.has(e.id)){ let endQ = q + len, endM = m, cur = e; while (cur.tieNext){ const nx = nextEvent(cur.id); if (!nx) break; skip.add(nx.id); cur = nx; endQ += evQn(nx); }
      const st = tAtQ(m, q), en = tAtQ(m, Math.min(barQn(m), q + len)) + Math.max(0, endQ - q - len) * exSpq();
      if (st >= S.playT - 1e-3 && st < S.playT + 120){ const w = t0 + (st - S.playT) / S.rate, d = Math.max(.08, (en - st) / S.rate * .95); e.pitches.forEach(p => synthNote(w, d, midi(p), .15 / Math.sqrt(e.pitches.length))); } }
    q += len; }); });
}
function synthNote(w, d, mn, amp){ const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = 440 * 2 ** ((mn - 69) / 12); o2.frequency.value = o.frequency.value * 2;
  g.gain.setValueAtTime(0, w); g.gain.linearRampToValueAtTime(amp, w + .012); g.gain.setTargetAtTime(amp * .45, w + .03, .18); g.gain.setTargetAtTime(0, w + d, .05);
  o.connect(g); o2.connect(g); g.connect(AC.destination); o.start(w); o2.start(w); o.stop(w + d + .4); o2.stop(w + d + .4); CLK.push(o, o2); }
function restartAt(t){ if (SRC){ SRC.onended = null; try { SRC.stop(); } catch (_){} } CLK.forEach(o => { try { o.stop(); } catch (_){} }); CLK = []; cancelAnimationFrame(RAF); S.playT = t; play(); }
function setLoop(a, b){ S.loopR = { a, b }; S.loopOn = true; renderLoopChip(); drawWave(); if (!S.playing){ S.playT = S.bt[a]; play(); } else restartAt(S.bt[a]); }
function renderLoopChip(){ const c = document.getElementById('loopChip'); if (!S.loopR || !S.loopOn){ c.hidden = true; return; } c.hidden = false; c.classList.add('is-on');
  c.innerHTML = `${ic('loop')}m.${S.loopR.a + 1}${S.loopR.b > S.loopR.a ? '–' + (S.loopR.b + 1) : ''} · ${Math.round(S.rate * 100)}%${ic('chevD')}`; }
function studentPreview(){ if (S.playing) stop(); S.preview = true; S.playT = Math.max(0, countInStart() - .15); animView(S.pps, (countInStart() - .6) * S.pps, true); play(); }
function stop(){ S.playing = false; S.preview = false; const cd = document.getElementById('countdown'); if (cd) cd.remove(); try { SRC && SRC.stop(); } catch (_){} CLK.forEach(o => { try { o.stop(); } catch (_){} }); CLK = []; cancelAnimationFrame(RAF); setPlayIc(); render(); }
function loop(){ if (!S.playing) return; S.playT = P0.t + (AC.currentTime - P0.c) * S.rate; if (S.loopOn && S.loopR && S.playT >= S.bt[S.loopR.b + 1]) return restartAt(S.bt[S.loopR.a]); const x = X(S.playT); if (x > W * .8 && S.focus == null){ S.scroll += x - W * .3; clampScroll(); }
  drawWave(); if (S.focus == null) renderStripOv(); updateTransport(); drawMonitor(); drawCountdown(); if (S.preview && S.playT > exEnd() + .8) return stop(); RAF = requestAnimationFrame(loop); }
function drawCountdown(){ let el = document.getElementById('countdown'); const beat = 4 / tsAt(S.ex.from)[1] * exSpq(); const on = S.playing && graded() && S.preview && S.playT >= countInStart() - .05 && S.playT < exStart();
  if (!on){ if (el) el.remove(); return; } const n = Math.ceil((exStart() - S.playT) / beat - 1e-6); if (!el){ el = document.createElement('div'); el.id = 'countdown'; el.className = 'countdown'; strip.appendChild(el); } if (el.dataset.n !== String(n)){ el.dataset.n = n; el.innerHTML = `<div>${n}<small>count-in · play on m.${S.ex.from + 1}</small></div>`; el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; } }
function seek(t){ S.playT = Math.max(0, Math.min(S.audio.dur, t)); if (S.playing){ stop(); play(); } else { drawWave(); if (S.focus == null) renderStripOv(); updateTransport(); drawMonitor(); } }
function setPlayIc(){ const b = document.getElementById('playBtn'); b.innerHTML = ic(S.playing ? 'pause' : 'play'); b.setAttribute('aria-label', S.playing ? 'Pause' : 'Play'); }
function updateTransport(){ const d = S.audio.dur, p = S.playT / d * 100; document.getElementById('scrubFill').style.width = p + '%'; document.getElementById('scrubPh').style.left = p + '%';
  document.getElementById('tpTime').innerHTML = `${fmt(S.playT, 0)}<span class="sep">/</span>${fmt(d, 0)}`;
  document.getElementById('scrubRegs').innerHTML = secBlocks().map(s => `<div class="reg" style="left:${s.t0 / d * 100}%;width:${(s.t1 - s.t0) / d * 100}%"></div><div class="tag" style="left:${s.t0 / d * 100}%">${s.name}</div>`).join('');
  document.getElementById('bpmTxt').textContent = S.score.tempo; }
document.getElementById('scrub').addEventListener('pointerdown', ev => { const el = ev.currentTarget, r = el.getBoundingClientRect(); const mv = e => seek((e.clientX - r.left) / r.width * S.audio.dur); mv(ev); el.setPointerCapture(ev.pointerId); el.onpointermove = mv; el.onpointerup = () => el.onpointermove = null; });
document.getElementById('playBtn').onclick = () => S.playing ? stop() : play();
document.getElementById('restartBtn').onclick = () => seek(S.focus != null ? S.bt[S.focus] : S.bt[0] - .5);
document.getElementById('clickBtn').onclick = e => { S.click = !S.click; e.currentTarget.classList.toggle('is-on', S.click); toast(S.click ? 'Click on. It follows your bar lines.' : 'Click off.'); if (S.playing){ stop(); play(); } };

/* ================= keyboard ================= */
window.addEventListener('keydown', ev => {
  const tag = (ev.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  const k = ev.key, mod = ev.metaKey || ev.ctrlKey;
  if (k === ' '){ ev.preventDefault(); S.playing ? stop() : play(); return; }
  if (mod && (k === 'z' || k === 'Z')){ ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if (k === 'Escape'){ if (document.querySelector('.pop')) return closePops(); const wn = document.getElementById('whatsnew'); if (!wn.hidden) return (wn.hidden = true); if (S.focus != null) return exitFocus(); S.sel = null; return render(); }
  if (S.focus == null){
    if ((k === 'l' || k === 'L') && !mod && S.sel){ ev.preventDefault(); const [a0, b0] = selRange(); return measureAct('loop'); }
    if ((k === 'f' || k === 'F') && !mod && watchLike()){ ev.preventDefault(); return toggleFlex(); }
    if ((k === 'Backspace' || k === 'Delete') && S.flexSel && watchLike()){ ev.preventDefault(); return removeFlex(S.flexSel); }
    if ((k === 'ArrowRight' || k === 'ArrowLeft') && !mod){ ev.preventDefault(); const d = k === 'ArrowRight' ? 1 : -1; if (!S.sel) S.sel = { a:0, b:0 }; else { const nb = Math.max(0, Math.min(NM() - 1, S.sel.b + d)); S.sel = ev.shiftKey ? { a:S.sel.a, b:nb } : { a:nb, b:nb }; } ensureVisible(S.sel.b); return render(); }
    const sr = selRange(); if (!sr) return;
    if (k === 'Enter'){ ev.preventDefault(); return setFocus(sr[0], true); }
    if (mod && k === 'c'){ ev.preventDefault(); return measureAct('copy'); }
    if (mod && k === 'v'){ ev.preventDefault(); return pasteAt(sr[0]); }
    if (mod && k === 'd'){ ev.preventDefault(); return measureAct('dup'); }
    if (k === 'Backspace' || k === 'Delete'){ ev.preventDefault(); return deleteMeasures(sr[0], sr[1]); }
    return;
  }
  if (mod && (k === 'ArrowRight' || k === 'ArrowLeft')){ ev.preventDefault(); const n = S.focus + (k === 'ArrowRight' ? 1 : -1); if (n >= 0 && n < NM()) setFocus(n, false, k === 'ArrowRight' ? 1 : -1); return; }
  if (/^[a-gA-G]$/.test(k) && !mod && !ev.altKey){ ev.preventDefault(); return enterLetter(k, ev.shiftKey); }
  if (KEY_DUR[k] && !mod){ ev.preventDefault(); return setDuration(KEY_DUR[k]); }
  if (k === 'r' || k === 'R' || k === '0'){ ev.preventDefault(); return enterRest(); }
  if (k === '.'){ ev.preventDefault(); return cycleDots(); }
  if (k === 't' || k === 'T'){ ev.preventDefault(); return applyTuplet(3, 2); }
  if (k === '+'){ ev.preventDefault(); return toggleTie(); }
  if (k === 's' || k === 'S'){ ev.preventDefault(); return addSpan('slur'); }
  if (k === 'n' || k === 'N'){ S.clickAdd = !S.clickAdd; return render(); }
  if (k === 'k' || k === 'K'){ return togglePiano(); }
  if (k === '[' || k === ']'){ const e = curEvent(); if (e && !e.rest){ S.nudges[e.id] = (S.nudges[e.id] || 0) + (k === ']' ? 1 : -1) * (ev.shiftKey ? 20 : 5); saving(); drawWave(); toast(`${pName(e.pitches[0])} nudged ${S.nudges[e.id] > 0 ? '+' : ''}${S.nudges[e.id]} ms.`); } return; }
  if (k === 'ArrowRight' || k === 'ArrowLeft'){ ev.preventDefault(); const evs = vEvs(S.focus, S.nsel.v), list = evs.map((_, i) => i).concat(['end']); const p = list.indexOf(S.nsel.i) + (k === 'ArrowRight' ? 1 : -1);
    if (ev.shiftKey){ if (!S.nAnchor) S.nAnchor = { ...S.nsel }; } else S.nAnchor = null;
    if (p < 0){ if (S.focus > 0){ setFocus(S.focus - 1, false, -1); S.nsel.i = 'end'; render(); } return; } if (p >= list.length){ if (S.focus < NM() - 1) setFocus(S.focus + 1, false, 1); return; } S.nsel.i = list[p]; return render(); }
  if (k === 'ArrowUp' || k === 'ArrowDown'){ ev.preventDefault(); return transposeSel(mod ? 'oct' : ev.shiftKey ? 'semi' : 'step', k === 'ArrowUp' ? 1 : -1); }
  if (k === 'Backspace' || k === 'Delete'){ ev.preventDefault(); return deleteNote(k === 'Backspace'); }
});

/* ================= lesson switch (mockup) ================= */
function applyLesson(){
  document.querySelectorAll('#lessonSeg button').forEach(b => b.classList.toggle('is-on', b.dataset.l === S.lesson));
  const ps = document.getElementById('partSeg'); ps.hidden = S.lesson !== 'exercise'; ps.querySelectorAll('button').forEach(b => b.classList.toggle('is-on', b.dataset.p === S.part));
  document.getElementById('lanes').hidden = watchLike();
  document.getElementById('lessonTitle').textContent = { video:'Danzón violin · Lesson 4', exercise:'Danzón violin · Exercise 4', jam:'Danzón jam · C major' }[S.lesson];
  const key = graded() ? 'X' : 'W';
  if (S._view !== key){ if (S._view) S.views[S._view] = { score:S.score, undo:S.undo, redo:S.redo, bt:S.bt, flex:S.flex }; const v = S.views[key]; S.score = v.score; S.undo = v.undo; S.redo = v.redo; S.bt = v.bt; S.flex = v.flex || []; S._view = key; }
  const nowG = graded(); S._graded = nowG; S.loopR = null; S.loopOn = false;
  S.audio = nowG ? S.audioX : S.audioW; S.flexOn = false;
  if (nowG){ setRange(0, NM() - 1); S.bt = exBars(); }
  if (!watchLike()){ S.lanes[0].clips[0] = { t:S.bt[0], len:S.bt[8] - S.bt[0] }; S.lanes[1].clips[0] = { t:S.bt[4], len:S.bt[NM()] - S.bt[4] }; }
  S.sel = null; if (S.focus != null) S.focus = null; setTimeout(() => fitScore(true), 0);
  S.pipPos = null; S.flexSel = null; recomputeWarp(); renderPip(); render(); renderPublish(false);
}
document.querySelectorAll('#lessonSeg button').forEach(b => b.onclick = () => { S.lesson = b.dataset.l; applyLesson(); });
document.querySelectorAll('#partSeg button').forEach(b => b.onclick = () => { S.part = b.dataset.p; applyLesson(); });
let CDRAG = null;
lanesC.addEventListener('pointerdown', ev => { const r = lanesC.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, ln = S.lanes[Math.floor(y / 32)]; if (!ln) return; const cl = ln.clips.find(c => x >= X(c.t) && x <= X(c.t + c.len)); if (!cl) return; CDRAG = { cl, x0:x, t0:cl.t }; lanesC.setPointerCapture(ev.pointerId); });
lanesC.addEventListener('pointermove', ev => { const r = lanesC.getBoundingClientRect(); if (!CDRAG){ lanesC.style.cursor = 'grab'; return; } let t = CDRAG.t0 + (ev.clientX - r.left - CDRAG.x0) / S.pps; const near = S.bt.reduce((b, x) => Math.abs(x - t) < Math.abs(b - t) ? x : b, S.bt[0]); if (Math.abs(near - t) * S.pps < 10) t = near; CDRAG.cl.t = t; tip(ev.clientX, ev.clientY, `starts ${fmt(t)}`); drawLanes(); });
lanesC.addEventListener('pointerup', () => { if (CDRAG){ CDRAG = null; tip(); saving(); renderRail(); } });

/* ================= app bar menus, what changed ================= */
document.getElementById('scoreMenu').onclick = ev => { const pop = openPop(ev.currentTarget, `<div class="pal list"><button data-t="add">${ic('filePlus')}Add score after the last measure</button><button data-t="rep">${ic('fileUp')}Replace score</button></div><p class="hint2">Both work as they do today.</p>`); pop.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { closePops(); toast('Unchanged from today.'); }); };
document.getElementById('previewChip').onclick = () => toast('Preview opens the student highway drawer. Unchanged from today.');
document.getElementById('undoBtn').onclick = undo; document.getElementById('redoBtn').onclick = redo;
document.getElementById('pubBtn').onclick = ev => { const n = S.dirty.W + S.dirty.X; if (!n) return toast('Everything is published. Students see what you see.');
  const parts = []; if (S.dirty.W) parts.push([S.lesson === 'exercise' ? 'Watch · A section' : S.lesson === 'jam' ? 'Jam score' : 'A section', S.dirty.W]); if (S.dirty.X) parts.push([S.lesson === 'jam' ? 'Jam session' : 'Exercise score', S.dirty.X]);
  const pop = openPop(ev.currentTarget, `<h4>Publish to students</h4>${parts.map(([l, c]) => `<div class="st-prop" style="padding:5px 2px"><span class="k" style="color:hsl(40 30% 92%)">${l}</span><span class="v">${c} change${c > 1 ? 's' : ''}</span></div>`).join('')}
    <p class="hint2">Students keep the last published version until you publish. Drafts save automatically and stay in History.</p><div class="row" style="margin-top:8px"><button class="st-btn-primary" id="pubGo">${ic('upload')}Publish now</button><button class="st-chip" id="pubDiscard">Discard this draft</button></div>`);
  pop.querySelector('#pubGo').onclick = () => { closePops(); publishAll(); }; pop.querySelector('#pubDiscard').onclick = () => { closePops(); discardDraft(); }; };
document.querySelectorAll('#hearSeg button').forEach(b => b.onclick = () => { S.hear = b.dataset.h; document.querySelectorAll('#hearSeg button').forEach(x => x.classList.toggle('is-on', x === b)); if (S.playing) restartAt(S.playT); if (S.hear !== 'rec') toast(S.hear === 'score' ? 'Hearing the written notes only. Wrong notes jump out.' : 'Hearing the recording and the written notes together.'); });
document.querySelector('#hearSeg [data-h="rec"]').classList.add('is-on');
document.getElementById('loopChip').onclick = ev => { const pop = openPop(ev.currentTarget, `<h4>Loop m.${S.loopR.a + 1}${S.loopR.b > S.loopR.a ? '–' + (S.loopR.b + 1) : ''}</h4><div class="pal wide">${[1, .75, .5].map(r => `<button data-rate="${r}" class="${S.rate === r ? 'on' : ''}">${r * 100}%</button>`).join('')}</div>
  <p class="hint2">Slower playback for checking fast passages. The mockup lowers the pitch; the app keeps it.</p><div class="row" style="margin-top:8px"><button class="st-chip" id="loopOff">${ic('x')}Stop looping</button></div>`, 'up');
  pop.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => { S.rate = +b.dataset.rate; closePops(); renderLoopChip(); if (S.playing) restartAt(S.playT); });
  pop.querySelector('#loopOff').onclick = () => { closePops(); S.loopOn = false; S.rate = 1; renderLoopChip(); if (S.playing) restartAt(S.playT); else render(); }; };
document.getElementById('wnBtn').onclick = () => { const w = document.getElementById('whatsnew'); w.hidden = !w.hidden; };
document.getElementById('whatsnew').innerHTML = `<h3>Round 6</h3><ol>
  <li><b>Separate scores again.</b> Watch keeps its sections (explain, play, explain…). Exercise has its own continuous score, all graded (voice 1). “Copy notes from a Watch section” gives you a head start, and after that the two scores are independent. Nothing to migrate.</li>
  <li><b>Draft vs live.</b> Every edit autosaves as a draft and students keep the published version. The app bar shows “<i>n</i> unpublished changes” and a pulsing <b>Publish</b> button with the count. The Watch/Exercise switch gets a gold dot on the part with unpublished edits, and leaving the page warns you. Publish lists what changed, and you can also discard the draft.</li>
  <li><b>History per section</b> (left panel, clock icon): published versions and draft autosaves, with the live one marked. Restore brings one back as a draft.</li>
  <li><b>Listen to the score.</b> In the transport, choose Recording, Score or Both. Score plays the written notes, so wrong notes jump out.</li>

  <li><b>MIDI keyboard entry</b> in the measure zoom (piano icon, or K). Play notes on a connected MIDI keyboard or the on-screen keys. Keys pressed together make a chord, and entry flows into the next bar like typing.</li></ol>
  <p style="font-size:12px;color:hsl(var(--muted-foreground));margin:12px 0 0">Try: edit anything and watch Publish light up · select m.2 → Loop → Both · double-click a bar → piano icon → play some keys.</p>`;

/* ================= render ================= */
let RQ = 0;
function scheduleRender(){ if (RQ) return; RQ = requestAnimationFrame(() => { RQ = 0; if (graded()) S.bt = exBars(); drawWave(); if (S.focus == null) renderStrip(); updateTransport(); }); }
function render(){ if (graded()){ setRange(0, NM() - 1); S.bt = exBars(); } drawWave(); renderStrip(); renderFocus(); renderRail(); renderWTools(); updateTransport(); paintIcons(); document.getElementById('undoBtn').disabled = !S.undo.length; document.getElementById('redoBtn').disabled = !S.redo.length; }
let toastT = 0;
function toast(msg, withUndo){ const t = document.getElementById('toast'); t.innerHTML = msg + (withUndo ? '<button id="tUndo">Undo</button>' : ''); t.hidden = false; t.style.animation = 'none'; void t.offsetWidth; t.style.animation = ''; const u = t.querySelector('#tUndo'); if (u) u.onclick = () => { undo(); t.hidden = true; }; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4500); }
const fmt = (t, dp = 2) => { const neg = t < 0; t = Math.abs(t); const m = Math.floor(t / 60), s = t - m * 60; return (neg ? '−' : '') + `${m}:${dp ? s.toFixed(dp).padStart(3 + dp, '0') : String(Math.floor(s)).padStart(2, '0')}`; };
let rzT = 0; new ResizeObserver(() => { clearTimeout(rzT); rzT = setTimeout(() => { W = wave.clientWidth; drawWave(); renderStrip(); if (S.focus != null) renderFocus(); }, 90); }).observe(document.getElementById('stage'));

async function boot(){

  try { await VF.loadFonts('Bravura', 'Academico'); VF.setFonts('Bravura', 'Academico'); } catch (_){}
  try { await document.fonts.ready; } catch (_){}

  S.audioW = analyse(synth()); S.score = scoreX; S.audioX = analyse(synth({ bpm:96, lead:3.1, steady:true })); S.score = scoreW; S.audio = S.audioW; S.ex.offset = 2.93;
  S.views.W = { score:scoreW, undo:[], redo:[], bt:seedBars(1.25, 96), flex:[] }; S.views.X = { score:scoreX, undo:[], redo:[], bt:[], flex:[] };
  const day = (d, h, mi) => new Date(2026, 8, d, h, mi);
  ['W', 'X'].forEach(k => { const v = S.views[k]; const snap = JSON.stringify({ score:v.score, bt:v.bt, flex:[], ex:S.ex }); S.history[k] = [{ kind:'published', at:day(21, 16, 2), snap }, { kind:'draft', at:day(22, 11, 9), snap }, { kind:'published', at:day(22, 11, 18), snap }]; S.published[k] = snap; }); S.sec2 = S.audio.riff.slice(); recomputeWarp();
  S.anchorT = 1.25; S.bt = S.views.W.bt;
  W = wave.clientWidth; fitScore(false); applyLesson();
  toast('Bars are placed at 96 BPM but the teacher drifts, and the dots mark bars that are off. Try Auto-place on the waveform.');
}
if (!VF) document.getElementById('stripSvg').innerHTML = '<p style="padding:16px">The notation engine didn’t load. Reload the page.</p>'; else boot();
})();
